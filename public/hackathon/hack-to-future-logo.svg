<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <!-- Background -->
  <rect width="800" height="300" fill="#ffffff"/>
  
  <!-- HACK text with glitch effect -->
  <defs>
    <style>
      .hack-text { font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; font-size: 72px; }
      .future-text { font-family: 'Arial', sans-serif; font-weight: bold; font-size: 48px; }
      .to-text { font-family: 'Arial', sans-serif; font-weight: normal; font-size: 32px; }
    </style>
  </defs>
  
  <!-- HACK with glitch lines -->
  <text x="50" y="120" class="hack-text" fill="#000000">HACK</text>
  <rect x="20" y="80" width="4" height="20" fill="#000000"/>
  <rect x="180" y="90" width="6" height="15" fill="#000000"/>
  <rect x="320" y="85" width="4" height="25" fill="#000000"/>
  
  <!-- Hacker figure in 'A' -->
  <circle cx="200" cy="90" r="8" fill="#1e3a8a"/>
  <rect x="196" y="98" width="8" height="15" fill="#1e3a8a"/>
  <rect x="193" y="110" width="14" height="8" fill="#1e3a8a"/>
  <rect x="198" y="86" width="4" height="4" fill="#60a5fa"/>
  
  <!-- TO THE -->
  <text x="285" y="170" class="to-text" fill="#000000">TO THE</text>
  
  <!-- FUTURE with glitch lines -->
  <text x="50" y="240" class="future-text" fill="#000000">FUTURE</text>
  <rect x="30" y="200" width="4" height="20" fill="#000000"/>
  <rect x="150" y="210" width="6" height="15" fill="#000000"/>
  <rect x="250" y="205" width="4" height="25" fill="#000000"/>
  <rect x="350" y="215" width="8" height="12" fill="#000000"/>
</svg>
