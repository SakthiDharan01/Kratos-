<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <!-- ETHIndia logo background -->
  <rect width="300" height="80" fill="transparent"/>
  
  <!-- Ethereum lotus symbol -->
  <g transform="translate(20, 15)">
    <!-- Outer petals -->
    <path d="M25 10 L35 25 L25 35 L15 25 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
    <path d="M10 25 L25 15 L35 25 L25 35 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
    <path d="M25 45 L15 30 L25 20 L35 30 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Inner symbol -->
    <polygon points="25,20 30,27 25,32 20,27" fill="#ffffff"/>
  </g>
  
  <!-- ETHIndia text -->
  <text x="70" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">ETHIndia</text>
</svg>
